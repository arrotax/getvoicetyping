<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Voice Typing Installed</title>
  <style>
    :root {
      --blue: #1769e0;
      --blue-dark: #0d47a1;
      --text: #202124;
      --muted: #5f6368;
      --line: #d7dce2;
      --page: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--page);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      color: var(--blue-dark);
      font-size: clamp(32px, 4vw, 44px);
      line-height: 1.12;
      letter-spacing: -1.2px;
      font-weight: 700;
    }

    .step {
      margin: 0 0 20px;
      padding: 0;
    }

    .step-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 10px;
      color: var(--text);
      font-size: clamp(19px, 2.2vw, 24px);
      line-height: 1.25;
      font-weight: 700;
      text-align: center;
    }

    .step-number {
      display: inline-grid;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--blue);
      font-size: 21px;
    }

    .screenshot {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #cfd5dc;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(32, 33, 36, 0.10);
    }

    @media (max-width: 640px) {
      main { width: min(100% - 20px, 900px); padding: 24px 0 40px; }
      header { margin-bottom: 18px; }
      .step { padding: 0; margin-bottom: 20px; }
      .step-title { gap: 9px; margin-bottom: 10px; }
      .step-number { width: 32px; height: 32px; font-size: 18px; }
    }
  </style>
</head>
